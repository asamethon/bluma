<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Bluma'yı indir</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #2a1b52;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    .mark {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      margin: 0 auto 22px;
      border-radius: 28px;
      background: #7c5cd0;
      box-shadow: 0 12px 40px rgba(124, 92, 208, .5);
      font-size: 46px;
    }
    h1 { margin: 0 0 10px; font-size: 30px; }
    p { margin: 0 0 26px; color: #d8d0ec; line-height: 1.5; }
    .stores { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .store {
      padding: 13px 20px;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🌸</div>
    <h1>Bluma</h1>
    <p id="message">Sana uygun mağazaya yönlendiriliyorsun…</p>
    <div class="stores">
      <a class="store" href="https://apps.apple.com/tr/app/bluma/id6749180146">App Store</a>
      <a class="store" href="https://play.google.com/store/apps/details?id=com.d4tecompany.bluma">Google Play</a>
    </div>
  </main>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var webDestination = isIOS
        ? "https://apps.apple.com/tr/app/bluma/id6749180146"
        : "https://play.google.com/store/apps/details?id=com.d4tecompany.bluma";
      var storeDestination = isIOS
        ? "itms-apps://itunes.apple.com/app/id6749180146"
        : isAndroid
          ? "market://details?id=com.d4tecompany.bluma"
          : null;

      if (storeDestination) {
        window.location.href = storeDestination;
        window.setTimeout(function () {
          if (!document.hidden) window.location.replace(webDestination);
        }, 1200);
        return;
      }

      document.getElementById("message").textContent =
        "Telefonuna uygun mağazayı seçerek Bluma'yı indirebilirsin.";
    })();
  </script>
</body>
</html>
