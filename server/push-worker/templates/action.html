<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<!-- oobCode adres çubuğunda taşınıyor; hiçbir dış isteğe Referer olarak sızmamalı. -->
<meta name="referrer" content="no-referrer" />
<title>Bluma</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #FBF8F3; color: #241F2E;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border: 1px solid #EDE7DC;
    border-radius: 18px; padding: 36px 32px; text-align: center;
  }
  .brand { font-size: 24px; font-weight: 700; color: #7C5CD0; letter-spacing: -.5px; margin-bottom: 24px; }
  .brand span { display: inline-block; width: 7px; height: 7px; border-radius: 7px; background: #FF5C8A; margin-left: 3px; vertical-align: 6px; }
  h1 { font-size: 20px; line-height: 27px; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 23px; color: #6B6478; margin: 0 0 18px; }
  .icon { font-size: 40px; line-height: 1; margin-bottom: 14px; }
  input {
    width: 100%; padding: 13px 14px; font-size: 16px; border: 1px solid #EDE7DC;
    border-radius: 12px; margin-bottom: 10px; background: #fff; color: #241F2E;
  }
  input:focus { outline: 2px solid #7C5CD0; outline-offset: -1px; }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 700; color: #fff;
    background: #7C5CD0; border: 0; border-radius: 12px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .link { display: inline-block; margin-top: 18px; color: #7C5CD0; font-size: 15px; font-weight: 600; text-decoration: none; }
  .error { color: #E5604F; font-size: 14px; margin-bottom: 12px; min-height: 20px; }
  .hint { font-size: 13px; color: #9A93A8; }
  @media (prefers-color-scheme: dark) {
    body { background: #17131F; color: #F3EFFA; }
    .card { background: #211B2C; border-color: #322A42; }
    p { color: #ADA4BD; }
    input { background: #17131F; color: #F3EFFA; border-color: #322A42; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">Bluma<span></span></div>
    <div id="view">
      <div class="icon">⏳</div>
      <h1 id="w1">Bir saniye…</h1>
      <p id="w2">İsteğin işleniyor.</p>
    </div>
  </main>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  // Bağlantıdaki lang parametresi postanın diliyle aynı gelir.
  var L = (q.get('lang') || 'tr').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
  document.documentElement.lang = L;
  var T = {
    tr: {
      wait: ['Bir saniye…', 'İsteğin işleniyor.'],
      back: 'Uygulamaya dön',
      failTitle: 'Bağlantı işe yaramadı',
      failBody: 'Bağlantının süresi dolmuş ya da daha önce kullanılmış olabilir. Uygulamadan yeni bir bağlantı iste.',
      failMissing: 'Bağlantı eksik görünüyor. E-postadaki adresin tamamını kopyaladığından emin ol.',
      failMode: 'Bu bağlantı türü desteklenmiyor.',
      pwTitle: 'Yeni şifreni belirle',
      pwBody: function (mail) { return mail + ' için yeni bir şifre gir.'; },
      pw1: 'Yeni şifre', pw2: 'Yeni şifre (tekrar)', pwSave: 'Şifreyi kaydet',
      pwRule: 'En az 8 karakter, en az bir harf ve bir rakam.',
      pwWeak: 'Şifre en az 8 karakter olmalı, en az bir harf ve bir rakam içermeli.',
      pwMismatch: 'Şifreler birbirini tutmuyor.',
      pwDone: ['Şifren güncellendi', 'Yeni şifrenle giriş yapabilirsin.'],
      verifyEmail: ['E-postan doğrulandı', 'Hesabın hazır. Uygulamaya dönebilirsin.'],
      verifyAndChangeEmail: ['Yeni adresin onaylandı', 'Hesabın artık bu e-posta adresini kullanıyor.'],
      recoverEmail: ['Adresin geri alındı', 'Hesabın eski e-posta adresine döndürüldü.']
    },
    en: {
      wait: ['One moment…', 'We are processing your request.'],
      back: 'Back to the app',
      failTitle: "That link didn't work",
      failBody: 'The link may have expired or already been used. Request a new one from the app.',
      failMissing: 'The link looks incomplete. Make sure you copied the whole address from the email.',
      failMode: 'This link type is not supported.',
      pwTitle: 'Set a new password',
      pwBody: function (mail) { return 'Enter a new password for ' + mail + '.'; },
      pw1: 'New password', pw2: 'New password (again)', pwSave: 'Save password',
      pwRule: 'At least 8 characters, with one letter and one number.',
      pwWeak: 'Password must be at least 8 characters and include a letter and a number.',
      pwMismatch: "Passwords don't match.",
      pwDone: ['Your password is updated', 'You can sign in with your new password.'],
      verifyEmail: ['Your email is verified', 'Your account is ready. You can go back to the app.'],
      verifyAndChangeEmail: ['Your new address is confirmed', 'Your account now uses this email address.'],
      recoverEmail: ['Your address is restored', 'Your account was reverted to the previous email address.']
    }
  }[L];
  var mode = q.get('mode');
  var oobCode = q.get('oobCode');
  var apiKey = q.get('apiKey');
  var view = document.getElementById('view');
  document.getElementById('w1').textContent = T.wait[0];
  document.getElementById('w2').textContent = T.wait[1];

  var API = 'https://identitytoolkit.googleapis.com/v1/accounts:';

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  function render(icon, title, text, extra) {
    view.innerHTML = '<div class="icon">' + icon + '</div><h1>' + esc(title) + '</h1>'
      + '<p>' + esc(text) + '</p>' + (extra || '');
  }

  var APP_LINK = '<a class="link" href="bluma://">' + T.back + '</a>';

  function fail(text) {
    render('⚠️', T.failTitle, text || T.failBody, APP_LINK);
  }

  function post(path, body) {
    return fetch(API + path + '?key=' + encodeURIComponent(apiKey), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error((data.error && data.error.message) || 'HATA');
        return data;
      });
    });
  }

  if (!mode || !oobCode || !apiKey) return fail(T.failMissing);

  // Şifre sıfırlama: önce kodu doğrula, sonra formu göster.
  if (mode === 'resetPassword') {
    post('resetPassword', { oobCode: oobCode }).then(function (data) {
      render('🔑', T.pwTitle, T.pwBody(data.email || ''),
        '<div class="error" id="err"></div>'
        + '<input id="pw" type="password" autocomplete="new-password" placeholder="' + T.pw1 + '" />'
        + '<input id="pw2" type="password" autocomplete="new-password" placeholder="' + T.pw2 + '" />'
        + '<button id="go">' + T.pwSave + '</button>'
        + '<p class="hint" style="margin-top:12px">' + T.pwRule + '</p>');

      var err = document.getElementById('err');
      document.getElementById('go').addEventListener('click', function () {
        var pw = document.getElementById('pw').value;
        var pw2 = document.getElementById('pw2').value;
        if (pw.length < 8 || !/[a-z]/i.test(pw) || !/[0-9]/.test(pw)) {
          err.textContent = T.pwWeak; return;
        }
        if (pw !== pw2) { err.textContent = T.pwMismatch; return; }
        err.textContent = '';
        this.disabled = true;
        post('resetPassword', { oobCode: oobCode, newPassword: pw }).then(function () {
          render('✅', T.pwDone[0], T.pwDone[1], APP_LINK);
        }).catch(function () { fail(); });
      });
    }).catch(function () { fail(); });
    return;
  }

  // Doğrulama, adres değişikliği ve adres geri alma aynı uç noktayı kullanır.
  if (!T[mode]) return fail(T.failMode);

  post('update', { oobCode: oobCode }).then(function () {
    render('✅', T[mode][0], T[mode][1], APP_LINK);
  }).catch(function () { fail(); });
})();
</script>
</body>
</html>
